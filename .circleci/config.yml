version: 2.1

executors:
  php_cli:
    docker:
      - image: php:8.3-cli-bullseye
    resource_class: medium
  php_cli_mysql:
    docker:
      - image: php:8.3-cli-bullseye
        environment:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dmb_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
      - image: cimg/mysql:8.0
        environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dmb_test
    resource_class: medium
  node_lts:
    docker:
      - image: cimg/node:22.14
    resource_class: small

commands:
  install_php_system_deps:
    steps:
      - run:
          name: Install PHP system dependencies and Composer
          command: |
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              git unzip zip curl \
              libicu-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev \
              libonig-dev libxml2-dev libzip-dev libsqlite3-dev sqlite3
            docker-php-ext-configure gd --with-freetype --with-jpeg
            docker-php-ext-install -j"$(nproc)" \
              bcmath exif gd intl mbstring pdo_mysql pdo_sqlite xml zip
            rm -rf /var/lib/apt/lists/*
            curl -sS https://getcomposer.org/installer | \
              php -- --install-dir=/usr/local/bin --filename=composer

  composer_install:
    steps:
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor

  npm_ci:
    parameters:
      path:
        type: string
    steps:
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "<< parameters.path >>/package-lock.json" }}
      - run:
          name: Install npm dependencies
          working_directory: << parameters.path >>
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "<< parameters.path >>/package-lock.json" }}
          paths:
            - << parameters.path >>/node_modules

  frontend_quality_steps:
    parameters:
      path:
        type: string
    steps:
      - checkout
      - npm_ci:
          path: << parameters.path >>
      - run:
          name: Lint
          working_directory: << parameters.path >>
          command: npm run lint
      - run:
          name: Prettier check
          working_directory: << parameters.path >>
          command: npm run format:check
      - run:
          name: TypeScript check
          working_directory: << parameters.path >>
          command: npm run typecheck
      - run:
          name: Build
          working_directory: << parameters.path >>
          command: npm run build

jobs:
  backend_quality:
    executor: php_cli
    steps:
      - checkout
      - install_php_system_deps
      - run:
          name: Prepare environment
          command: cp .env.example .env
      - composer_install
      - run:
          name: Generate app key and discover packages
          command: |
            php artisan key:generate --no-interaction
            php artisan package:discover
      - run:
          name: Backend CI
          command: composer ci:backend

  backend_mysql_smoke:
    executor: php_cli_mysql
    steps:
      - checkout
      - install_php_system_deps
      - run:
          name: Prepare environment
          command: cp .env.example .env
      - composer_install
      - run:
          name: Generate app key and discover packages
          command: |
            php artisan key:generate --no-interaction
            php artisan package:discover
      - run:
          name: Wait for MySQL
          command: |
            for i in $(seq 1 60); do
              php -r 'new PDO("mysql:host=127.0.0.1;port=3306;dbname=dmb_test","root","root");' \
                && exit 0 || true
              sleep 2
            done
            exit 1
      - run:
          name: Import baseline schema
          command: php ci_import_test_schema.php
      - run:
          name: Migrate and smoke test
          command: |
            php artisan migrate --force
            php artisan test --testsuite=Feature --filter=BackendApiRegressionTest

  user_frontend_quality:
    executor: node_lts
    steps:
      - frontend_quality_steps:
          path: New User Panel Frontend

workflows:
  quality:
    jobs:
      - backend_quality
      - backend_mysql_smoke
      - user_frontend_quality
