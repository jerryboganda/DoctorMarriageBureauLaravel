name: Production VPS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS (185.252.233.186)
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '185.252.233.186' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat > ~/.ssh/config <<EOF
          Host vps-production
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/vps_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy to VPS
        env:
          VPS_PATH: ${{ secrets.VPS_PATH || '/opt/docker/doctormarriagebureau' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh vps-production "
            set -e
            echo '==> Preparing deployment directory at $VPS_PATH...'
            mkdir -p '$VPS_PATH'
            if [ ! -d '$VPS_PATH/.git' ]; then
              echo '==> Initializing git repository...'
              git clone '$REPO_URL' '$VPS_PATH'
              cd '$VPS_PATH'
              git checkout '$BRANCH'
            else
              cd '$VPS_PATH'
              echo '==> Fetching latest changes from $BRANCH...'
              git fetch origin '$BRANCH'
              git reset --hard 'origin/$BRANCH'
            fi

            if [ ! -f .env ]; then
              echo '==> Setting up production .env...'
              cp .env.example .env
              php -r \"echo 'APP_KEY=base64:'.base64_encode(random_bytes(32)).PHP_EOL;\" >> .env || true
            fi

            echo '==> Building and starting modernized stack (Astro + Go + Rust)...'
            cd '$VPS_PATH/Modernized-Platform/infra/docker'
            mkdir -p /opt/docker/doctormarriagebureau/public/uploads
            docker compose -f docker-compose.production.yml build web api
            docker compose -f docker-compose.production.yml up -d --remove-orphans

            echo '==> Applying idempotent SQL migrations...'
            for attempt in 1 2 3 4 5 6; do
              if docker compose -f docker-compose.production.yml exec -T postgres pg_isready -U dmb_user -d doctor_marriage_bureau >/dev/null 2>&1; then
                break
              fi
              echo \"Waiting for postgres (\$attempt)...\"
              sleep 3
            done
            for f in \$(ls -1 /opt/docker/doctormarriagebureau/Modernized-Platform/infra/migrations/*.up.sql 2>/dev/null | sort); do
              echo \"==> Running migration \$(basename \"\$f\")\"
              docker compose -f docker-compose.production.yml exec -T postgres \\
                psql -U dmb_user -d doctor_marriage_bureau -v ON_ERROR_STOP=0 -f \"/docker-entrypoint-initdb.d/\$(basename \"\$f\")\"
            done

            echo '==> Ensuring Admin user admin@admin.com credentials set to 123123123...'
            docker compose -f docker-compose.production.yml exec -T postgres psql -U dmb_user -d doctor_marriage_bureau -c \"
              UPDATE users 
              SET password = '\$2b\$10\$/UvSOA7AwlOpz5HlSEoD5eFuGUkGdOFwAThFp2EMj1rzn6a/RUim6',
                  user_type = 'admin',
                  membership = 3,
                  approved = true,
                  blocked = false,
                  deactivated = false,
                  updated_at = NOW()
              WHERE LOWER(email) = 'admin@admin.com';

              INSERT INTO users (first_name, last_name, name, email, phone, password, user_type, membership, approved, blocked, deactivated, photo, photo_approved, email_verified_at, created_at, updated_at)
              SELECT 'Admin', 'Administrator', 'Super Administrator', 'admin@admin.com', '03001234567', '\$2b\$10\$/UvSOA7AwlOpz5HlSEoD5eFuGUkGdOFwAThFp2EMj1rzn6a/RUim6', 'admin', 3, true, false, false, '', 1, NOW(), NOW(), NOW()
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE LOWER(email) = 'admin@admin.com');

              UPDATE users 
              SET password = '\$2b\$10\$/UvSOA7AwlOpz5HlSEoD5eFuGUkGdOFwAThFp2EMj1rzn6a/RUim6',
                  user_type = 'admin',
                  membership = 3,
                  approved = true,
                  blocked = false,
                  deactivated = false,
                  updated_at = NOW()
              WHERE LOWER(email) = 'dev-admin@panel.doctormarriagebureau.com.pk';

              INSERT INTO users (first_name, last_name, name, email, phone, password, user_type, membership, approved, blocked, deactivated, photo, photo_approved, email_verified_at, created_at, updated_at)
              SELECT 'Developer', 'Admin', 'Developer Testing Account', 'dev-admin@panel.doctormarriagebureau.com.pk', '03000000000', '\$2b\$10\$/UvSOA7AwlOpz5HlSEoD5eFuGUkGdOFwAThFp2EMj1rzn6a/RUim6', 'admin', 3, true, false, false, '', 1, NOW(), NOW(), NOW()
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE LOWER(email) = 'dev-admin@panel.doctormarriagebureau.com.pk');

              SELECT id, email, name, user_type, membership FROM users WHERE LOWER(user_type)='admin' OR membership=3 ORDER BY id;
            \" || true

            echo '==> Deployment command completed.'
          "

      - name: Verify Production Health
        run: |
          echo "==> Verifying API health on https://panel.doctormarriagebureau.com.pk/api/health..."
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error https://panel.doctormarriagebureau.com.pk/api/health; then
              echo ""
              echo "✅ Production VPS Deployment Health Check Passed!"
              exit 0
            fi
            echo "Health check attempt $attempt waiting for container startup..." >&2
            sleep 5
          done
          echo "❌ Production API health check failed." >&2
          exit 1
