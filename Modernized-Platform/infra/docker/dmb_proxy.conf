server {
  set $forward_scheme http;
  set $server "172.17.0.1";
  set $port 8089;

  listen 80;
  listen [::]:80;

  listen 443 ssl;
  listen [::]:443 ssl;

  server_name panel.doctormarriagebureau.com.pk doctormarriagebureau.com.pk www.doctormarriagebureau.com.pk;

  ssl_certificate /etc/letsencrypt/live/panel_dmb_cert.pem;
  ssl_certificate_key /etc/letsencrypt/live/panel_dmb_key.pem;

  include conf.d/include/block-exploits.conf;

  access_log /data/logs/proxy-host-44_access.log proxy;
  error_log /data/logs/proxy-host-44_error.log warn;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
   proxy_set_header X-Forwarded-Proto  $scheme;
   proxy_set_header X-Forwarded-For    $remote_addr;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_pass http://172.17.0.1:8089;
  }
}
