name: Hostinger Build And Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy artifact to Hostinger after build
        required: true
        default: false
        type: boolean

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Hostinger artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, exif, gd, intl, mbstring, pdo_mysql, xml, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Build user panel
        run: npm run hostinger:build

      - name: Create deploy archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.circleci' \
            --exclude='.builds' \
            --exclude='node_modules' \
            --exclude='New User Panel Frontend/node_modules' \
            --exclude='DMB Mobile App' \
            --exclude='docker-compose.yml' \
            --exclude='deploy/Dockerfile' \
            --exclude='deploy/nginx*' \
            --exclude='deploy/fast-deploy.sh' \
            --exclude='deploy/circleci-remote-deploy.sh' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='public/uploads' \
            --exclude='storage/app/public/uploads' \
            --exclude='tests/fixtures/ci/*.sql.gz' \
            -czf /tmp/dmb-hostinger-artifact.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: dmb-hostinger-artifact
          path: /tmp/dmb-hostinger-artifact.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to Hostinger
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dmb-hostinger-artifact
          path: /tmp

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY || secrets.DEPLOY_KEY }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || secrets.DEPLOY_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          test -n "$HOSTINGER_SSH_KEY"
          test -n "$HOSTINGER_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger
          chmod 600 ~/.ssh/hostinger
          ssh-keyscan -p "${HOSTINGER_PORT:-65002}" -H "$HOSTINGER_HOST" >> ~/.ssh/known_hosts

      - name: Upload and release on Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || secrets.DEPLOY_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER || secrets.DEPLOY_USER }}
          HOSTINGER_PATH: ${{ secrets.HOSTINGER_PATH || secrets.DEPLOY_PATH }}
        run: |
          test -n "$HOSTINGER_USER"
          test -n "$HOSTINGER_PATH"
          ssh -i ~/.ssh/hostinger -p "${HOSTINGER_PORT:-65002}" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "mkdir -p '$HOSTINGER_PATH/.builds' '$HOSTINGER_PATH/deploy'"
          scp -i ~/.ssh/hostinger -P "${HOSTINGER_PORT:-65002}" \
            deploy/hostinger-release.sh \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_PATH/deploy/hostinger-release.sh"
          scp -i ~/.ssh/hostinger -P "${HOSTINGER_PORT:-65002}" \
            /tmp/dmb-hostinger-artifact.tar.gz \
            "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_PATH/.builds/dmb-hostinger-artifact.tar.gz"
          ssh -i ~/.ssh/hostinger -p "${HOSTINGER_PORT:-65002}" "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "cp '$HOSTINGER_PATH/deploy/hostinger-release.sh' /tmp/dmb-hostinger-release.sh && cd '$HOSTINGER_PATH' && bash /tmp/dmb-hostinger-release.sh .builds/dmb-hostinger-artifact.tar.gz"
