# Production Docker Compose for Doctor Marriage Bureau Modernized Stack
# Target VPS: 185.252.233.186
services:
  postgres:
    image: postgres:16-alpine
    container_name: dmb-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doctor_marriage_bureau}
      POSTGRES_USER: ${POSTGRES_USER:-dmb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmb_secure_pass_2026}
    volumes:
      - dmb-postgres-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    networks:
      - dmb-internal
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: dmb-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_pass_2026}"]
    volumes:
      - dmb-redis-data:/data
    networks:
      - dmb-internal
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: ../../services/api
      dockerfile: ../../infra/docker/Dockerfile.go-api
    container_name: dmb-go-api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-dmb_user}:${POSTGRES_PASSWORD:-dmb_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-doctor_marriage_bureau}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      RUST_COMPUTE_URL: http://compute:8081
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_2026}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-dmb-media-production}
      UPLOAD_DIR: /uploads
      UPLOAD_BASE_URL: /uploads
    volumes:
      - /opt/docker/doctormarriagebureau/public/uploads:/uploads
    networks:
      - dmb-internal
      - nginx-proxy-manager_default
    deploy:
      resources:
        limits:
          memory: 256M

  compute:
    build:
      context: ../../services/rust-compute
      dockerfile: ../../infra/docker/Dockerfile.rust-compute
    container_name: dmb-rust-compute
    restart: always
    depends_on:
      - redis
    environment:
      PORT: 8081
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
    networks:
      - dmb-internal
    deploy:
      resources:
        limits:
          memory: 128M

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/Dockerfile.astro-web
    container_name: dmb-astro-web
    restart: always
    ports:
      - "8089:80"
    volumes:
      - /opt/docker/doctormarriagebureau/public/uploads:/usr/share/nginx/html/uploads:ro
    networks:
      - dmb-internal
      - nginx-proxy-manager_default
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  dmb-internal:
    driver: bridge
  nginx-proxy-manager_default:
    external: true

volumes:
  dmb-postgres-data:
  dmb-redis-data:
